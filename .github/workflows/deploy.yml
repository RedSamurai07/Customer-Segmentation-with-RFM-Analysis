name: ML Model CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest  # Adding pytest for local tests
    - name: Run code check (Linting)
      run: |
        # Simple syntax check
        python -m py_compile train.py
    - name: Run Sample Test
      run: |
        # Dummy test to ensure the script can at least be imported/initialized
        python -c "import train; print('Import successful')"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v2
    - name: Build Docker Image
      run: |
        docker build -t rfm-customer-segmentation:latest .
    - name: Docker Image Scan
      run: |
        echo "Scanning image for vulnerabilities..."
        # In a real scenario, you'd use a tool like Trivy or Snyk here
    
